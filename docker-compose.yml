services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOSET_SEED=42
      # Para activar los métodos LLM del Componente A, descomenta y pon tu clave:
      # - OPENAI_API_KEY=sk-...
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3
